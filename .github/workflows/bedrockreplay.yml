name: Build BedrockReplay Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Configure
        run: >-
          xmake f -y -p android -a arm64-v8a -m release
          --ndk=${{ steps.ndk.outputs.ndk-path }}

      - name: Build
        run: |
          xmake -y
          test -s build/android/arm64-v8a/release/libBedrockReplay.so
          test -s build/android/arm64-v8a/release/BedrockReplay.levipack
          python3 -m zipfile -t build/android/arm64-v8a/release/BedrockReplay.levipack

      - uses: actions/upload-artifact@v4
        with:
          name: BedrockReplay-Android
          path: |
            build/android/arm64-v8a/release/libBedrockReplay.so
            build/android/arm64-v8a/release/BedrockReplay.levipack
          if-no-files-found: error
